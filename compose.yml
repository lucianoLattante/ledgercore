services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ledgercore
      POSTGRES_USER: ${LEDGERCORE_DB_USER:?set the local database username}
      POSTGRES_PASSWORD: ${LEDGERCORE_DB_PASSWORD:?set the local database password}
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ledgercore"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ledgercore-data:/var/lib/postgresql/data
volumes:
  ledgercore-data:
